name: Update paper plot

on:
  push:
    branches: [master]
    paths:
      - README.md
      - paper_plot.py

permissions:
  contents: write

jobs:
  update-plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install matplotlib seaborn numpy pillow

      - name: Generate plot
        env:
          MPLBACKEND: Agg
        run: python paper_plot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ct_intersection_ml.png
          if ! git diff --cached --quiet; then
            git commit -m "Update paper plot [skip ci]"
            git push
          fi
